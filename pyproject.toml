[project]
name = "narrative-lens"
version = "0.1.0"
description = "Narrative Lens — local-first narrative sense-making app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Used directly for definition_json validation, not just via FastAPI.
    "pydantic>=2.0",
    # QR codes for capture links (PRD §4). Pure Python, rendered locally.
    "qrcode>=8.0",
    # PNG output for the QR, and the chart exports PRD §1.7 needs later.
    # Self-contained wheels — not the kind of native dependency §9 assumption 11
    # ruled out when it chose browser printing over a PDF library.
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # starlette's TestClient asks for httpx2; the suite runs warnings-as-errors,
    # so the older httpx would fail collection on its deprecation notice.
    "httpx2>=2.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
